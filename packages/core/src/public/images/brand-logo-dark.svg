      .tk-wordmark-dark {
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
    </style>
  </defs>

  <!-- Icon mark on the left, inverted for dark theme: green background, navy T -->
