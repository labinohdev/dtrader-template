    <rect width="56" height="56" rx="12" fill="#0a1d56"/>
    <rect x="12" y="16" width="32" height="6" rx="1" fill="#ffffff"/>
    <rect x="25" y="16" width="6" height="27" rx="1" fill="#ffffff"/>
    <path d="M 18 43 L 22 43 L 28 37 L 34 43 L 38 43 L 28 33 Z" fill="#00d09c"/>
  </g>

  <!-- Wordmark to the right of the icon -->
